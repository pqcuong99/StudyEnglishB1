<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#E0F7FA"/>
  <!-- desk -->
  <rect x="120" y="200" width="200" height="14" rx="4" fill="#8D6E63"/>
  <rect x="130" y="214" width="12" height="80" fill="#6D4C41"/>
  <rect x="298" y="214" width="12" height="80" fill="#6D4C41"/>
  <!-- doctor giving advice -->
  <circle cx="110" cy="96" r="28" fill="#FFCC80"/>
  <path d="M82 90 a28 28 0 0 1 56 0 Z" fill="#9E9E9E"/>
  <circle cx="102" cy="100" r="3.5" fill="#3E2723"/><circle cx="122" cy="100" r="3.5" fill="#3E2723"/>
  <circle cx="102" cy="100" r="9" fill="none" stroke="#37474F" stroke-width="2.5"/>
  <circle cx="122" cy="100" r="9" fill="none" stroke="#37474F" stroke-width="2.5"/>
  <path d="M111 100 h2" stroke="#37474F" stroke-width="2.5"/>
  <path d="M100 112 q12 6 24 0" stroke="#3E2723" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M80 128 h60 l8 72 h-76 Z" fill="#FFF"/>
  <path d="M104 128 l6 20 6 -20" fill="#42A5F5"/>
  <rect x="86" y="150" width="14" height="12" rx="2" fill="#42A5F5"/>
  <path d="M100 136 q-14 20 0 34 q14 -14 0 -34" fill="none" stroke="#37474F" stroke-width="3"/>
  <circle cx="100" cy="172" r="5" fill="#37474F"/>
  <path d="M138 142 L182 150" stroke="#FFCC80" stroke-width="12" stroke-linecap="round"/>
  <!-- clipboard -->
  <g transform="rotate(8 200 160)">
    <rect x="176" y="126" width="56" height="70" rx="4" fill="#8D6E63"/>
    <rect x="182" y="134" width="44" height="58" fill="#FFF"/>
    <rect x="194" y="122" width="20" height="10" rx="3" fill="#607D8B"/>
    <path d="M188 148 h32 M188 160 h32 M188 172 h20" stroke="#90A4AE" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- patient listening -->
  <circle cx="300" cy="106" r="26" fill="#FFCC80"/>
  <path d="M274 100 a26 26 0 0 1 52 0 Z" fill="#3E2723"/>
  <circle cx="292" cy="110" r="3.5" fill="#3E2723"/><circle cx="310" cy="110" r="3.5" fill="#3E2723"/>
  <path d="M292 120 q8 6 16 0" stroke="#3E2723" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M274 132 h52 l6 68 h-64 Z" fill="#26A69A"/>
  <path d="M278 146 L248 166" stroke="#FFCC80" stroke-width="11" stroke-linecap="round"/>
  <!-- speech bubble -->
  <path d="M60 22 h150 a10 10 0 0 1 10 10 v28 a10 10 0 0 1 -10 10 h-110 l-14 14 v-14 h-26 a10 10 0 0 1 -10 -10 v-28 a10 10 0 0 1 10 -10 Z" fill="#FFF" stroke="#00897B" stroke-width="3"/>
  <text x="135" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#00897B">You should rest.</text>
  <!-- check mark -->
  <circle cx="350" cy="230" r="26" fill="#66BB6A"/>
  <path d="M338 230 l9 9 16 -18" stroke="#FFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
