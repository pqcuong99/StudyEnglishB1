<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#FCE4EC"/>
  <!-- donation box -->
  <rect x="110" y="140" width="180" height="120" rx="8" fill="#8D6E63"/>
  <rect x="100" y="130" width="200" height="22" rx="6" fill="#6D4C41"/>
  <rect x="170" y="126" width="60" height="8" rx="4" fill="#3E2723"/>
  <path d="M200 232 l-34 -34 a20 20 0 0 1 34 -26 a20 20 0 0 1 34 26 Z" fill="#E53935"/>
  <!-- coins dropping in -->
  <g fill="#FFD54F" stroke="#F9A825" stroke-width="3">
    <ellipse cx="200" cy="96" rx="20" ry="8"/>
    <circle cx="160" cy="60" r="16"/>
    <circle cx="240" cy="70" r="16"/>
  </g>
  <text x="160" y="66" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#F57F17" text-anchor="middle">$</text>
  <text x="240" y="76" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#F57F17" text-anchor="middle">$</text>
  <!-- giving hands -->
  <path d="M400 60 L290 84" stroke="#FFCC80" stroke-width="26" stroke-linecap="round"/>
  <path d="M400 60 L350 71" stroke="#AB47BC" stroke-width="36" stroke-linecap="round"/>
  <path d="M0 200 L90 190" stroke="#FFCC80" stroke-width="26" stroke-linecap="round"/>
  <path d="M0 200 L40 195" stroke="#42A5F5" stroke-width="36" stroke-linecap="round"/>
  <!-- floating hearts -->
  <g fill="#F48FB1">
    <path d="M60 80 l-12 -12 a7 7 0 0 1 12 -9 a7 7 0 0 1 12 9 Z"/>
    <path d="M340 190 l-10 -10 a6 6 0 0 1 10 -8 a6 6 0 0 1 10 8 Z"/>
    <path d="M80 130 l-8 -8 a5 5 0 0 1 8 -6 a5 5 0 0 1 8 6 Z"/>
  </g>
</svg>
