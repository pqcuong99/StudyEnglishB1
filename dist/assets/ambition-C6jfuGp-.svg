  <polygon points="160,118 200,60 240,118 222,108 200,120 178,108" fill="#ECEFF1"/>
  <polygon points="200,20 209,42 232,42 214,56 220,78 200,65 180,78 186,56 168,42 191,42" fill="#FFC107"/>
  <!-- climber -->
