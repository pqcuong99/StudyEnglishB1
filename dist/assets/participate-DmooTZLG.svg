      <rect x="-17" y="-96" width="34" height="58" rx="9" fill="currentColor"/>
      <path d="M-14 -88 L-32 -128 M14 -88 L32 -128" stroke="#FFCC80" stroke-width="9" stroke-linecap="round"/>
      <circle cx="-33" cy="-131" r="6" fill="#FFCC80"/><circle cx="33" cy="-131" r="6" fill="#FFCC80"/>
      <circle cy="-112" r="16" fill="#FFCC80"/>
      <path d="M-16 -114 a16 14 0 0 1 32 0 v2 h-32 Z" fill="#4E342E"/>
      <circle cx="-5" cy="-110" r="2" fill="#3E2723"/><circle cx="5" cy="-110" r="2" fill="#3E2723"/>
