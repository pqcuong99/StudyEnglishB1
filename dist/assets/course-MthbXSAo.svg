  <rect x="200" y="196" width="60" height="14" rx="6" fill="#EF5350"/>
  <g fill="#B0BEC5">
    <rect x="208" y="218" width="10" height="8" rx="2"/><rect x="225" y="218" width="10" height="8" rx="2"/><rect x="242" y="218" width="10" height="8" rx="2"/>
    <rect x="208" y="234" width="10" height="8" rx="2"/><rect x="225" y="234" width="10" height="8" rx="2" fill="#43A047"/><rect x="242" y="234" width="10" height="8" rx="2"/>
