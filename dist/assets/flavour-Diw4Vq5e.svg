<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#FCE4EC"/>
  <!-- three ice cream cones with different flavours -->
  <g>
    <path d="M70 150 L100 250 L130 150 Z" fill="#E0A96D" stroke="#B57A3E" stroke-width="3"/>
    <circle cx="100" cy="128" r="34" fill="#F48FB1"/><circle cx="90" cy="118" r="6" fill="#E91E63"/>
    <path d="M170 150 L200 250 L230 150 Z" fill="#E0A96D" stroke="#B57A3E" stroke-width="3"/>
    <circle cx="200" cy="128" r="34" fill="#6D4C41"/><circle cx="210" cy="118" r="5" fill="#A1887F"/>
    <path d="M270 150 L300 250 L330 150 Z" fill="#E0A96D" stroke="#B57A3E" stroke-width="3"/>
    <circle cx="300" cy="128" r="34" fill="#A5D6A7"/><circle cx="292" cy="120" r="4" fill="#2E7D32"/><circle cx="308" cy="132" r="4" fill="#2E7D32"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="100" y="80" fill="#C2185B">strawberry</text>
    <text x="200" y="80" fill="#4E342E">chocolate</text>
    <text x="300" y="80" fill="#2E7D32">mint</text>
  </g>
  <text x="200" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#AD1457">flavour</text>
</svg>
