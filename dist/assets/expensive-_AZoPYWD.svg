<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#FFF8E1"/>
  <!-- diamond ring on a cushion -->
  <ellipse cx="200" cy="230" rx="130" ry="30" fill="#B71C1C"/>
  <ellipse cx="200" cy="222" rx="130" ry="30" fill="#E53935"/>
  <circle cx="200" cy="160" r="52" fill="none" stroke="#FFC107" stroke-width="16"/>
  <circle cx="200" cy="160" r="52" fill="none" stroke="#FFD54F" stroke-width="6"/>
  <polygon points="200,60 232,90 200,130 168,90" fill="#B3E5FC"/>
  <polygon points="200,60 232,90 200,96 168,90" fill="#E1F5FE"/>
  <polygon points="168,90 200,96 200,130" fill="#81D4FA"/>
  <!-- price tag -->
  <g transform="translate(300 70) rotate(15)">
    <path d="M0 0 h70 l20 22 l-20 22 h-70 z" fill="#FFF" stroke="#795548" stroke-width="4"/>
    <circle cx="80" cy="22" r="4" fill="#795548"/>
    <text x="34" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#C62828">$$$</text>
  </g>
  <!-- sparkles -->
  <path d="M120 70 v24 M108 82 h24" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/>
  <path d="M90 130 v16 M82 138 h16" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
  <path d="M290 150 v16 M282 158 h16" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
  <text x="200" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#C62828">very high price</text>
</svg>
