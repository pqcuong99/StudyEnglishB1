<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F3E5F5"/>
  <!-- confetti -->
  <g>
    <rect x="40" y="40" width="10" height="16" rx="2" fill="#EF5350" transform="rotate(20 45 48)"/>
    <rect x="350" y="70" width="10" height="16" rx="2" fill="#42A5F5" transform="rotate(-30 355 78)"/>
    <rect x="70" y="230" width="10" height="16" rx="2" fill="#66BB6A" transform="rotate(45 75 238)"/>
    <rect x="330" y="220" width="10" height="16" rx="2" fill="#FFCA28" transform="rotate(-15 335 228)"/>
    <circle cx="90" cy="110" r="6" fill="#AB47BC"/>
    <circle cx="320" cy="150" r="6" fill="#26A69A"/>
    <circle cx="360" cy="260" r="5" fill="#EF5350"/>
    <circle cx="30" cy="180" r="5" fill="#42A5F5"/>
  </g>
  <!-- paper -->
  <rect x="120" y="40" width="160" height="200" rx="8" fill="#FFF" stroke="#B0BEC5" stroke-width="3"/>
  <g fill="#CFD8DC">
    <rect x="138" y="130" width="120" height="8" rx="4"/>
    <rect x="138" y="150" width="100" height="8" rx="4"/>
    <rect x="138" y="170" width="116" height="8" rx="4"/>
    <rect x="138" y="190" width="80" height="8" rx="4"/>
    <rect x="138" y="210" width="106" height="8" rx="4"/>
  </g>
  <text x="200" y="108" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#E53935" text-anchor="middle">A+</text>
  <!-- big star -->
  <path d="M310 30 l12 26 29 3 -22 19 7 28 -26 -15 -26 15 7 -28 -22 -19 29 -3 Z" fill="#FFC107" stroke="#F57F17" stroke-width="3" stroke-linejoin="round"/>
  <!-- trophy -->
  <path d="M40 180 h60 v30 a30 30 0 0 1 -60 0 Z" fill="#FFB300"/>
  <path d="M40 186 h-14 a14 14 0 0 0 14 22 M100 186 h14 a14 14 0 0 1 -14 22" stroke="#FFB300" stroke-width="6" fill="none"/>
  <rect x="62" y="238" width="16" height="16" fill="#F57F17"/>
  <rect x="48" y="254" width="44" height="12" rx="3" fill="#795548"/>
  <path d="M70 196 l3 7 8 1 -6 5 2 8 -7 -4 -7 4 2 -8 -6 -5 8 -1 Z" fill="#FFF8E1"/>
  <!-- badge ribbon -->
  <circle cx="290" cy="220" r="26" fill="#EF5350"/>
  <circle cx="290" cy="220" r="18" fill="#FFCDD2"/>
  <path d="M278 246 l-8 30 l20 -10 l20 10 l-8 -30 Z" fill="#C62828"/>
  <path d="M282 220 l6 6 l12 -12" stroke="#C62828" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
