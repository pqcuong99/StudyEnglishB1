<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#E3F2FD"/>
  <!-- person at a fork in the road, choosing A or B -->
  <path d="M200 260 L200 190 L93 90" stroke="#BDBDBD" stroke-width="26" fill="none" stroke-linejoin="round"/>
  <path d="M200 190 L307 90" stroke="#BDBDBD" stroke-width="26" fill="none"/>
  <rect x="58" y="44" width="70" height="34" rx="6" fill="#EF5350"/>
  <text x="93" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">A</text>
  <rect x="272" y="44" width="70" height="34" rx="6" fill="#42A5F5"/>
  <text x="307" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">B</text>
  <circle cx="200" cy="170" r="18" fill="#FFCC80"/>
  <rect x="186" y="188" width="28" height="44" rx="10" fill="#5C6BC0"/>
  <path d="M190 232 V258 M210 232 V258" stroke="#37474F" stroke-width="7" stroke-linecap="round"/>
  <path d="M214 196 L236 172" stroke="#FFCC80" stroke-width="7" stroke-linecap="round"/>
  <!-- thought bubble with a tick -->
  <circle cx="240" cy="148" r="4" fill="#FFFFFF"/><circle cx="252" cy="134" r="6" fill="#FFFFFF"/>
  <circle cx="278" cy="136" r="22" fill="#FFFFFF"/>
  <path d="M268 136 l7 8 l14 -16" stroke="#2E7D32" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0D47A1">decide</text>
</svg>
