  <circle cx="222" cy="118" r="18" fill="#FFCC80"/>
  <path d="M204 116 a18 16 0 0 1 36 0 v2 h-36 Z" fill="#3E2723"/>
  <circle cx="230" cy="120" r="2" fill="#3E2723"/>
