  <rect x="160" y="266" width="36" height="14" rx="6" fill="#212121"/>
  <rect x="204" y="266" width="36" height="14" rx="6" fill="#212121"/>
  <!-- thumbs up bubble -->
  <circle cx="330" cy="230" r="34" fill="#FFF" stroke="#43A047" stroke-width="4"/>
  <path d="M318 232 v18 h-8 v-18 Z" fill="#43A047"/>
  <path d="M320 232 l8 -16 q4 -8 8 -2 l-2 12 h12 q6 0 5 6 l-4 16 q-1 4 -6 4 h-21 Z" fill="#43A047"/>
