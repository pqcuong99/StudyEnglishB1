  <path d="M240 126 L280 170 L250 200" stroke="#FFCC80" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M160 126 L130 160" stroke="#1E88E5" stroke-width="18" stroke-linecap="round"/>
  <path d="M240 126 L270 160" stroke="#1E88E5" stroke-width="18" stroke-linecap="round"/>
