    <path d="M320 150 l3 8 9 1 -7 6 2 9 -7 -5 -7 5 2 -9 -7 -6 9 -1 Z"/>
    <path d="M60 170 l3 8 9 1 -7 6 2 9 -7 -5 -7 5 2 -9 -7 -6 9 -1 Z"/>
