<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F3E5F5"/>
  <!-- desk -->
  <rect x="200" y="190" width="190" height="16" rx="4" fill="#8D6E63"/>
  <rect x="210" y="206" width="14" height="80" fill="#6D4C41"/>
  <rect x="366" y="206" width="14" height="80" fill="#6D4C41"/>
  <!-- in-tray with papers -->
  <rect x="300" y="166" width="70" height="24" rx="4" fill="#5C6BC0"/>
  <rect x="306" y="156" width="58" height="14" fill="#FFF" stroke="#BDBDBD" stroke-width="2"/>
  <!-- teacher seated -->
  <circle cx="330" cy="96" r="24" fill="#FFCC80"/>
  <path d="M306 90 a24 24 0 0 1 48 0 Z" fill="#9E9E9E"/>
  <circle cx="322" cy="98" r="3" fill="#3E2723"/><circle cx="338" cy="98" r="3" fill="#3E2723"/>
  <path d="M322 108 q8 5 16 0" stroke="#3E2723" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M306 120 h48 l6 70 h-60 Z" fill="#26A69A"/>
  <path d="M310 132 L262 158" stroke="#FFCC80" stroke-width="11" stroke-linecap="round"/>
  <!-- student standing -->
  <circle cx="90" cy="80" r="28" fill="#FFCC80"/>
  <path d="M62 74 a28 28 0 0 1 56 0 Z" fill="#3E2723"/>
  <circle cx="82" cy="84" r="3.5" fill="#3E2723"/><circle cx="102" cy="84" r="3.5" fill="#3E2723"/>
  <path d="M80 94 q12 8 24 0" stroke="#3E2723" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M60 112 h60 l10 100 h-80 Z" fill="#EF5350"/>
  <rect x="70" y="212" width="24" height="74" rx="4" fill="#37474F"/>
  <rect x="100" y="212" width="24" height="74" rx="4" fill="#37474F"/>
  <path d="M116 126 L200 150" stroke="#FFCC80" stroke-width="13" stroke-linecap="round"/>
  <!-- paper being handed over -->
  <g transform="rotate(-10 230 150)">
    <rect x="196" y="120" width="70" height="60" fill="#FFF" stroke="#BDBDBD" stroke-width="3"/>
    <path d="M206 134 h50 M206 146 h50 M206 158 h34" stroke="#90A4AE" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
