<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#E8F5E9"/>
  <!-- steps -->
  <g fill="#A5D6A7">
    <rect x="30" y="260" width="70" height="40"/>
    <rect x="100" y="230" width="70" height="70"/>
    <rect x="170" y="200" width="70" height="100"/>
    <rect x="240" y="170" width="70" height="130"/>
    <rect x="310" y="140" width="70" height="160"/>
  </g>
  <!-- rising arrow -->
  <path d="M60 248 L290 112" stroke="#43A047" stroke-width="8" stroke-linecap="round"/>
  <path d="M272 100 L306 102 L296 132 Z" fill="#43A047"/>
  <!-- person cheering on the top step -->
  <circle cx="345" cy="52" r="20" fill="#FFCC80"/>
  <path d="M325 48 a20 20 0 0 1 40 0 Z" fill="#6D4C41"/>
  <circle cx="340" cy="54" r="2.5" fill="#3E2723"/><circle cx="352" cy="54" r="2.5" fill="#3E2723"/>
  <path d="M340 62 q6 5 12 0" stroke="#3E2723" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M328 72 h34 l4 44 h-42 Z" fill="#FF7043"/>
  <rect x="332" y="116" width="14" height="24" rx="3" fill="#37474F"/>
  <rect x="348" y="116" width="14" height="24" rx="3" fill="#37474F"/>
  <path d="M330 80 L306 60" stroke="#FFCC80" stroke-width="9" stroke-linecap="round"/>
  <path d="M362 80 L386 60" stroke="#FFCC80" stroke-width="9" stroke-linecap="round"/>
  <!-- badge + mini chart -->
  <rect x="30" y="30" width="120" height="44" rx="8" fill="#FFF" stroke="#43A047" stroke-width="3"/>
  <text x="90" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2E7D32" text-anchor="middle">+80%</text>
  <g fill="#66BB6A">
    <rect x="180" y="60" width="14" height="30"/>
    <rect x="200" y="46" width="14" height="44"/>
    <rect x="220" y="30" width="14" height="60"/>
  </g>
</svg>
