<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#EFEBE9"/>
  <!-- folder / case file -->
  <path d="M60 80 h70 l14 16 h116 a10 10 0 0 1 10 10 v134 a10 10 0 0 1 -10 10 h-200 a10 10 0 0 1 -10 -10 v-150 a10 10 0 0 1 10 -10 Z" fill="#FFB74D"/>
  <rect x="70" y="112" width="180" height="128" rx="6" fill="#FFF"/>
  <g fill="#CFD8DC">
    <rect x="86" y="130" width="120" height="8" rx="4"/>
    <rect x="86" y="150" width="140" height="8" rx="4"/>
    <rect x="86" y="170" width="100" height="8" rx="4"/>
    <rect x="86" y="190" width="130" height="8" rx="4"/>
    <rect x="86" y="210" width="90" height="8" rx="4"/>
  </g>
  <text x="140" y="104" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5D4037">CASE</text>
  <rect x="50" y="96" width="220" height="14" fill="#F57C00" opacity="0.5"/>
  <!-- magnifier -->
  <circle cx="230" cy="180" r="44" fill="#E3F2FD" fill-opacity="0.6" stroke="#1E88E5" stroke-width="10"/>
  <path d="M262 212 L306 256" stroke="#1E88E5" stroke-width="16" stroke-linecap="round"/>
  <path d="M206 168 a26 26 0 0 1 26 -20" stroke="#FFF" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- question mark inside lens -->
  <text x="230" y="194" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#1565C0" text-anchor="middle">?</text>
  <!-- briefcase (cái hộp) -->
  <rect x="300" y="60" width="80" height="60" rx="8" fill="#6D4C41"/>
  <rect x="300" y="82" width="80" height="6" fill="#4E342E"/>
  <rect x="322" y="46" width="36" height="18" rx="6" fill="none" stroke="#6D4C41" stroke-width="7"/>
  <rect x="332" y="84" width="16" height="10" rx="2" fill="#FFCA28"/>
  <!-- small box -->
  <rect x="304" y="170" width="70" height="50" rx="4" fill="#BCAAA4"/>
  <path d="M304 180 h70" stroke="#8D6E63" stroke-width="4"/>
  <path d="M339 170 v50" stroke="#8D6E63" stroke-width="4"/>
</svg>
